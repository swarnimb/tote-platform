<div hx-swap-oob="innerHTML:#convert-modal-container">
  <div id="convert-modal" style="display:flex; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:60; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto;">
    <div style="background:#fff; border-radius:16px; padding:28px 32px; width:100%; max-width:480px; position:relative;">

      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <h2 style="font-size:18px; font-weight:700; color:#111827; margin:0;">Convert to Supplier</h2>
        <button type="button" onclick="document.getElementById('convert-modal').remove()" style="background:none; border:none; cursor:pointer; color:#6b7280; font-size:20px; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;">✕</button>
      </div>
      <p style="font-size:13px; color:#6b7280; margin:0 0 20px;">{{ lead.company_name }} is now an active supplier. Create their supplier record?</p>

      <form method="post" action="/suppliers">
        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:12px; font-weight:500; color:#374151; margin-bottom:6px;">Company Name <span style="color:#dc2626;">*</span></label>
          <input type="text" name="company_name" value="{{ prefill.company_name }}" required style="border:1px solid #d1d5db; border-radius:8px; padding:10px 13px; font-size:14px; color:#111827; width:100%; box-sizing:border-box; min-height:44px; outline:none;" />
        </div>
        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:12px; font-weight:500; color:#374151; margin-bottom:6px;">Location <span style="color:#dc2626;">*</span></label>
          <input type="text" name="location" value="{{ prefill.location }}" required style="border:1px solid #d1d5db; border-radius:8px; padding:10px 13px; font-size:14px; color:#111827; width:100%; box-sizing:border-box; min-height:44px; outline:none;" />
        </div>
        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:12px; font-weight:500; color:#374151; margin-bottom:6px;">Contact Name</label>
          <input type="text" name="contact_name" value="{{ prefill.contact_name }}" style="border:1px solid #d1d5db; border-radius:8px; padding:10px 13px; font-size:14px; color:#111827; width:100%; box-sizing:border-box; min-height:44px; outline:none;" />
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;">
          <div>
            <label style="display:block; font-size:12px; font-weight:500; color:#374151; margin-bottom:6px;">Phone</label>
            <input type="text" name="phone" value="{{ prefill.phone }}" style="border:1px solid #d1d5db; border-radius:8px; padding:10px 13px; font-size:14px; color:#111827; width:100%; box-sizing:border-box; min-height:44px; outline:none;" />
          </div>
          <div>
            <label style="display:block; font-size:12px; font-weight:500; color:#374151; margin-bottom:6px;">Email</label>
            <input type="email" name="email" value="{{ prefill.email }}" style="border:1px solid #d1d5db; border-radius:8px; padding:10px 13px; font-size:14px; color:#111827; width:100%; box-sizing:border-box; min-height:44px; outline:none;" />
          </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" onclick="document.getElementById('convert-modal').remove()" style="background:#fff; border:1px solid #d1d5db; color:#374151; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:500; min-height:44px; cursor:pointer;">Skip</button>
          <button type="submit" style="background:#2563eb; color:#fff; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:500; min-height:44px; border:none; cursor:pointer;">Create Supplier</button>
        </div>
      </form>

    </div>
  </div>
</div>
