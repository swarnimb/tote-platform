<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ToteOps{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script>if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}</script>
  <style>
    body { font-family: 'Inter', sans-serif; }

    #sidebar {
      position: fixed; top: 0; left: 0;
      width: 240px; height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex; flex-direction: column;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    #main-content { margin-left: 240px; }

    #sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.35); z-index: 40;
    }

    #toast-container {
      position: fixed; top: 20px; right: 20px;
      z-index: 100; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 18px; border-radius: 8px;
      font-size: 14px; font-weight: 500; color: #374151;
      text-decoration: none; min-height: 44px;
      transition: background-color 0.15s, color 0.15s;
    }
    .nav-item:hover { background-color: #f9fafb; }
    .nav-item.active { background-color: #eff6ff; color: #2563eb; }

    .nav-logout-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 11px 18px; border-radius: 8px;
      font-size: 14px; font-weight: 500; color: #6b7280;
      background: none; border: none; cursor: pointer;
      text-align: left; min-height: 44px;
      transition: background-color 0.15s, color 0.15s;
    }
    .nav-logout-btn:hover { background-color: #f9fafb; color: #374151; }

    .tbl-row:hover { background-color: #f9fafb; }
    [data-theme='dark'] .tbl-row:hover { background-color: #374151 !important; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9999px; }

    /* === DARK MODE === */
    [data-theme='dark'] body { background-color: #111827 !important; }

    [data-theme='dark'] #sidebar { background: #1f2937 !important; border-color: #374151 !important; }
    [data-theme='dark'] #mobile-topbar { background: #1f2937 !important; border-color: #374151 !important; }
    [data-theme='dark'] #mobile-topbar span { color: #f9fafb !important; }

    [data-theme='dark'] .nav-item { color: #d1d5db !important; }
    [data-theme='dark'] .nav-item:hover { background-color: #374151 !important; color: #f9fafb !important; }
    [data-theme='dark'] .nav-item.active { background-color: #1e3a5f !important; color: #60a5fa !important; }
    [data-theme='dark'] .nav-logout-btn { color: #9ca3af !important; }
    [data-theme='dark'] .nav-logout-btn:hover { background-color: #374151 !important; color: #d1d5db !important; }

    /* White backgrounds → dark card */
    [data-theme='dark'] [style*="background:#fff"],
    [data-theme='dark'] [style*="background: #fff"],
    [data-theme='dark'] [style*="background-color: #fff"],
    [data-theme='dark'] [style*="background:#ffffff"],
    [data-theme='dark'] [style*="background: #ffffff"],
    [data-theme='dark'] [style*="background-color:#fff"],
    [data-theme='dark'] [style*="background-color:#ffffff"] { background-color: #1f2937 !important; }

    /* Light gray backgrounds → dark */
    [data-theme='dark'] [style*="background:#f9fafb"],
    [data-theme='dark'] [style*="background: #f9fafb"],
    [data-theme='dark'] [style*="background-color: #f9fafb"],
    [data-theme='dark'] [style*="background-color:#f9fafb"] { background-color: #283548 !important; }

    [data-theme='dark'] [style*="background:#f3f4f6"],
    [data-theme='dark'] [style*="background: #f3f4f6"] { background-color: #374151 !important; }

    [data-theme='dark'] [style*="background:#f8f9fb"] { background-color: #111827 !important; }

    /* Borders */
    [data-theme='dark'] [style*="border:1px solid #e5e7eb"],
    [data-theme='dark'] [style*="border: 1px solid #e5e7eb"],
    [data-theme='dark'] [style*="border-bottom:1px solid #e5e7eb"],
    [data-theme='dark'] [style*="border-bottom: 1px solid #e5e7eb"],
    [data-theme='dark'] [style*="border-top:1px solid #e5e7eb"],
    [data-theme='dark'] [style*="border-right:1px solid #e5e7eb"] { border-color: #374151 !important; }
    [data-theme='dark'] [style*="border-bottom:1px solid #f3f4f6"],
    [data-theme='dark'] [style*="border-bottom: 1px solid #f3f4f6"] { border-color: #2d3748 !important; }
    [data-theme='dark'] [style*="border:1px solid #d1d5db"],
    [data-theme='dark'] [style*="border: 1px solid #d1d5db"] { border-color: #4b5563 !important; }
    [data-theme='dark'] [style*="border:1px solid #fca5a5"] { border-color: #ef4444 !important; }

    /* Text */
    [data-theme='dark'] [style*="color:#111827"] { color: #f9fafb !important; }
    [data-theme='dark'] [style*="color: #111827"] { color: #f9fafb !important; }
    [data-theme='dark'] [style*="color:#374151"] { color: #d1d5db !important; }
    [data-theme='dark'] [style*="color: #374151"] { color: #d1d5db !important; }
    [data-theme='dark'] [style*="color:#6b7280"] { color: #9ca3af !important; }
    [data-theme='dark'] [style*="color: #6b7280"] { color: #9ca3af !important; }
    [data-theme='dark'] [style*="color:#9ca3af"] { color: #6b7280 !important; }

    /* Inputs, selects, textareas */
    [data-theme='dark'] input:not([type='checkbox']),
    [data-theme='dark'] textarea,
    [data-theme='dark'] select {
      background-color: #283548 !important;
      color: #f9fafb !important;
      border-color: #4b5563 !important;
    }
    [data-theme='dark'] input[readonly] { background-color: #1f2937 !important; }
    [data-theme='dark'] input::placeholder,
    [data-theme='dark'] textarea::placeholder { color: #6b7280 !important; }

    [data-theme='dark'] ::-webkit-scrollbar-thumb { background: #4b5563; }

    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      body.sidebar-open #sidebar { transform: translateX(0); }
      body.sidebar-open #sidebar-overlay { display: block; }
      #main-content { margin-left: 0; }
      #mobile-topbar { display: flex; }
    }
    @media (min-width: 769px) {
      #mobile-topbar { display: none; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body style="background-color: #f8f9fb; min-height: 100vh;">

  <!-- Mobile top bar -->
  <div id="mobile-topbar" style="position: sticky; top: 0; z-index: 30; background: #ffffff; border-bottom: 1px solid #e5e7eb; height: 56px; padding: 0 16px; align-items: center; gap: 12px;">
    <button id="hamburger-btn" aria-label="Open navigation" style="padding: 8px; border: none; background: none; cursor: pointer; border-radius: 6px; color: #374151; min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span style="font-size: 16px; font-weight: 700; color: #111827;">ToteOps</span>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" aria-hidden="true"></div>

  <!-- Sidebar -->
  <nav id="sidebar" aria-label="Main navigation">

    <!-- Logo -->
    <div style="padding: 20px 16px 16px; border-bottom: 1px solid #e5e7eb;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="background-color: #eff6ff; border-radius: 10px; width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        </div>
        <span style="font-size: 15px; font-weight: 700; color: #111827;">ToteOps</span>
      </div>
    </div>

    <!-- Nav links -->
    <div style="flex: 1; padding: 10px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;">

      <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a href="/suppliers" class="nav-item {% if request.url.path.startswith('/suppliers') %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Suppliers
      </a>

      <a href="/gradeouts" class="nav-item {% if request.url.path.startswith('/gradeouts') %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Gradeouts
      </a>

      <a href="/invoices" class="nav-item {% if request.url.path.startswith('/invoices') %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="12" y1="17" x2="8" y2="17"/>
        </svg>
        Invoices
      </a>

      <a href="/leads" class="nav-item {% if request.url.path.startswith('/leads') %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Leads
      </a>

      <a href="/growth" class="nav-item {% if request.url.path.startswith('/growth') %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
          <polyline points="17 6 23 6 23 12"/>
        </svg>
        Growth Planning
      </a>

    </div>

    <!-- Sidebar footer -->
    <div style="padding: 10px 12px; border-top: 1px solid #e5e7eb;">
      <!-- Theme toggle -->
      <button id="theme-toggle" type="button" class="nav-logout-btn" onclick="toggleTheme()" style="margin-bottom:4px;">
        <span id="theme-icon">
          <!-- Moon (shown in light mode) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
        <span id="theme-label">Dark Mode</span>
      </button>
      <form method="post" action="/logout">
        <button type="submit" class="nav-logout-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </form>
    </div>

  </nav>

  <!-- Main content -->
  <main id="main-content">
    <div style="max-width: 80rem; margin: 0 auto; padding: 24px 24px 40px;">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Toast container (HTMX notifications) -->
  <div id="toast-container" role="status" aria-live="polite"></div>

  <!-- Pickup Confirmation Modal (global — used on dashboard, suppliers list, supplier detail) -->
  <div id="pickup-confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:70; align-items:center; justify-content:center; padding:24px 16px;">
    <div style="background:#fff; border-radius:16px; padding:28px 32px; width:100%; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.18);">
      <h2 style="font-size:17px; font-weight:700; color:#111827; margin:0 0 8px;">Confirm Pickup</h2>
      <p style="font-size:14px; color:#374151; margin:0 0 24px;">Log a confirmed pickup for <strong id="pickup-confirm-name" style="color:#111827;"></strong>?</p>
      <div style="display:flex; gap:12px; justify-content:flex-end;">
        <button type="button" onclick="cancelPickupConfirm()" style="background:#fff; border:1px solid #d1d5db; color:#374151; border-radius:8px; padding:10px 20px; font-size:14px; font-weight:500; cursor:pointer; min-height:44px;">No, go back</button>
        <button type="button" onclick="confirmPickup()" style="background:#2563eb; border:none; color:#fff; border-radius:8px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer; min-height:44px;">Yes, record it</button>
      </div>
    </div>
  </div>

  <script>
    var _pendingPickupSelect = null;

    function handleActionStageMousedown(el) {
      el.dataset.previousValue = el.value;
      if (el.value === 'pickup_confirmed') {
        el.value = '';
      }
    }

    function handleActionStageChange(el) {
      var val = el.value;
      var supplierId = el.dataset.supplierId;
      var supplierName = el.dataset.supplierName;
      if (val === 'pickup_confirmed') {
        _pendingPickupSelect = el;
        document.getElementById('pickup-confirm-name').textContent = supplierName;
        document.getElementById('pickup-confirm-modal').style.display = 'flex';
        return;
      }
      el.dataset.previousValue = val;
      htmx.ajax('PATCH', '/suppliers/' + supplierId + '/action-stage', {
        values: { last_action_stage: val },
        swap: 'none'
      });
    }

    function confirmPickup() {
      var el = _pendingPickupSelect;
      if (!el) return;
      var supplierId = el.dataset.supplierId;
      htmx.ajax('PATCH', '/suppliers/' + supplierId + '/action-stage', {
        values: { last_action_stage: 'pickup_confirmed' },
        swap: 'none'
      });
      htmx.ajax('POST', '/pickups', {
        values: { supplier_id: supplierId },
        swap: 'none',
        headers: { 'HX-Request': 'true' }
      });
      el.value = 'pickup_confirmed';
      el.dataset.previousValue = 'pickup_confirmed';
      _pendingPickupSelect = null;
      document.getElementById('pickup-confirm-modal').style.display = 'none';
      setTimeout(function() { location.reload(); }, 300);
    }

    function cancelPickupConfirm() {
      if (_pendingPickupSelect) {
        _pendingPickupSelect.value = _pendingPickupSelect.dataset.previousValue || '';
        _pendingPickupSelect = null;
      }
      document.getElementById('pickup-confirm-modal').style.display = 'none';
    }
  </script>

  <!-- Sidebar toggle + theme JS -->
  <script>
    (function () {
      var body = document.body;
      var hamburger = document.getElementById('hamburger-btn');
      var overlay = document.getElementById('sidebar-overlay');

      function openSidebar() { body.classList.add('sidebar-open'); }
      function closeSidebar() { body.classList.remove('sidebar-open'); }

      hamburger.addEventListener('click', openSidebar);
      overlay.addEventListener('click', closeSidebar);

      document.querySelectorAll('.nav-item').forEach(function (link) {
        link.addEventListener('click', function () {
          if (window.innerWidth <= 768) { closeSidebar(); }
        });
      });

      // Apply saved theme on load
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeButton(true);
      }
    })();

    function updateThemeButton(isDark) {
      var label = document.getElementById('theme-label');
      var icon = document.getElementById('theme-icon');
      if (isDark) {
        label.textContent = 'Light Mode';
        icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      } else {
        label.textContent = 'Dark Mode';
        icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      }
    }

    function toggleTheme() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        updateThemeButton(false);
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        updateThemeButton(true);
      }
    }
  </script>

</body>
</html>
