name: Deploy demo to GitHub Pages

# Builds the ToteTrack (v2) static demo and publishes it to GitHub Pages.
#
# The export is prerendered against a throwaway PostgreSQL service seeded with
# synthetic data, so the published HTML carries real numbers with no database
# or Supabase project behind it at runtime.

on:
  push:
    branches: [main]
    paths:
      - 'v2-totetrack/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than cancelling it
# half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2-totetrack

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: totetrack_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/totetrack_demo
      # Placeholders. Demo mode swaps the Supabase client for a stub and blocks
      # every write, so nothing here is ever used to reach a real project.
      NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: demo-anon-key-not-real
      SUPABASE_SERVICE_ROLE_KEY: demo-service-role-key-not-real
      ADMIN_EMAIL: admin@totetrack.app
      NEXT_PUBLIC_APP_URL: https://swarnimb.github.io/tote-platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2-totetrack/package-lock.json

      - run: npm ci

      - name: Apply schema
        run: node db/demo/setup-db.mjs

      - name: Seed synthetic demo data
        run: npx tsx db/seed-demo.ts

      - name: Build static export
        run: npx next build

      - name: Write root redirect
        run: node scripts/write-root-redirect.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2-totetrack/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
